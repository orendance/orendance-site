<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אורן שמואל - האתר הרשמי | Oren Shmuel</title>

<meta name="description"
content="אורן שמואל - כוריאוגרף ויוצר במחול הישראלי ובריקודי עם ישראליים">

<link rel="icon" type="image/jpeg" href="icons/favicon.jpg">

<style>

body{
    margin:0;
    padding:0;
    background:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 25px;
}

/* התמונה */

.hero-image{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:0 auto;
}

/* אזור השמות */

.bio-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:10px;
}

/* עברית */

.bio-he{
    flex:1;
    text-align:right;
}

.bio-he h1{
    margin:0;
    color:#556b2f;
    font-size:42px;
}

.bio-he p{
    margin-top:8px;
    color:#555;
    line-height:1.5;
    font-size:22px;
}

/* אנגלית */

.bio-en{
    flex:1;
    text-align:left;
}

.bio-en h2{
    margin:0;
    color:#556b2f;
    font-size:42px;
}

.bio-en p{
    margin-top:8px;
    color:#555;
    line-height:1.5;
    font-size:22px;
}

/* OrenDance באמצע */

.brand{
    flex:1;
    text-align:center;
    color:#556b2f;
    font-weight:bold;
    font-size:34px;
    padding-top:5px;
}

/* כפתורים */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.buttons a{
    background:#556b2f;
    color:white;
    text-decoration:none;
    padding:14px 28px;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
}

.buttons a:hover{
    opacity:.9;
}

/* ========================= */
/* מובייל */
/* ========================= */

@media (max-width:768px){

    .hero-image{
        max-width:100%;
    }

    .bio-row{
        flex-direction:column;
        align-items:center;
        gap:20px;
        margin-top:10px;
    }

    .bio-he,
    .bio-en,
    .brand{
        width:100%;
        text-align:center;
    }

    .bio-he h1{
        font-size:30px;
    }

    .bio-en h2{
        font-size:30px;
    }

    .bio-he p,
    .bio-en p{
        font-size:18px;
    }

    .brand{
        font-size:28px;
        order:-1;
    }

    .buttons{
        flex-direction:column;
        gap:12px;
        margin-top:20px;
    }

    .buttons a{
        width:100%;
        box-sizing:border-box;
        text-align:center;
    }

}

</style>

</head>

<body>

<div class="container">

    <img
    src="images/oren-no-text.jpg"
    alt="Oren Shmuel - Israeli Folk Dance Choreographer and Creator"
    class="hero-image">

    <div class="bio-row">

        <div class="bio-he">

            <h1>אורן שמואל</h1>

            <p>
            כוריאוגרף ויוצר במחול הישראלי<br>
            ובריקודי עם ישראליים
            </p>

        </div>

        <div class="brand">
            OrenDance
        </div>

        <div class="bio-en">

            <h2>Oren Shmuel</h2>

            <p>
            Israeli Folk Dance<br>
            Choreographer and Creator
            </p>

        </div>

    </div>

    <div class="buttons">

        <a href="resume-he.html">
            פרופיל בעברית
        </a>

        <a href="resume-en.html">
            English Profile
        </a>

    </div>

</div>

</body>
</html>
