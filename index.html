<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אורן שמואל - האתר הרשמי | Oren Shmuel</title>

<meta name="description" content="אורן שמואל - כוריאוגרף ויוצר במחול הישראלי ובריקודי עם ישראליים">

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#fff;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 30px;
}

.brand{
    font-size:clamp(32px,5vw,60px);
    font-weight:bold;
    color:#222;
    margin:10px 0 5px;
}

.hero-image{
    width:100%;
    max-width:800px;
    height:auto;
    display:block;
    margin:0 auto;
}

.bio-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:40px;
    margin-top:10px;
}

.bio-he{
    text-align:right;
    flex:1;
}

.bio-en{
    text-align:left;
    flex:1;
}

.bio-he h1,
.bio-en h2{
    margin:0;
    color:#556b2f;
}

.bio-he p,
.bio-en p{
    margin-top:8px;
    line-height:1.5;
    font-size:18px;
    color:#555;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
}

.buttons a{
    background:#556b2f;
    color:white;
    text-decoration:none;
    padding:14px 28px;
    border-radius:8px;
    font-weight:bold;
    font-size:18px;
    transition:.2s;
}

.buttons a:hover{
    opacity:.9;
}

@media (max-width:768px){

    .bio-row{
        flex-direction:column;
        gap:15px;
    }

    .bio-he,
    .bio-en{
        text-align:center;
    }

    .buttons{
        flex-direction:column;
        gap:12px;
    }

    .buttons a{
        width:100%;
        box-sizing:border-box;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="brand">OrenDance</div>

    <img src="images/oren_blank_short.jpg"
         alt="Oren Shmuel - Israeli Folk Dance Choreographer and Creator"
         class="hero-image">

    <div class="bio-row">

        <div class="bio-he">
            <h1>אורן שמואל</h1>
            <p>
                כוריאוגרף ויוצר במחול הישראלי<br>
                ובריקודי עם ישראליים
            </p>
        </div>

        <div class="bio-en">
            <h2>Oren Shmuel</h2>
            <p>
                Israeli Folk Dance<br>
                Choreographer and Creator
            </p>
        </div>

    </div>

    <div class="buttons">
        <a href="resume-he.html">פרופיל בעברית</a>
        <a href="resume-en.html">English Profile</a>
    </div>

</div>

</body>
</html>
