<!DOCTYPE html>

<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>אורן שמואל - האתר הרשמי | Oren Shmuel</title>

<meta name="description"
content="אורן שמואל - כוריאוגרף ויוצר במחול הישראלי ובריקודי עם ישראליים">

<link rel="icon" type="image/jpeg" href="icons/favicon.jpg">

<style>

body{
    margin:0;
    padding:0;
    background:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 20px;
}

/* תמונה */

.hero-image{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:40px auto 0 auto;
    position:relative;
    left:15px;
    z-index:1;
}
    
.bio-he,
.bio-en{
    position:relative;
    z-index:10;
}
    
/* אזור טקסט */

.bio-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:-170px;
}

/* עברית */

.bio-he{
    flex:1;
    text-align:right;
}

.bio-he h1{
    margin:0;
    color:#556b2f;
    font-size:42px;
}

.bio-he p{
    margin-top:2px;
    color:#555;
    line-height:1.5;
    font-size:22px;
}

/* אנגלית */

.bio-en{
    flex:1;
    text-align:left;
}

.bio-en h2{
    margin:0;
    color:#556b2f;
    font-size:42px;
}

.bio-en p{
    margin-top:2px;
    color:#555;
    line-height:1.5;
    font-size:22px;
}

/* מותג */

.brand{
    display:none;
    flex:1;
    text-align:center;
    color:#556b2f;
    padding-top:75px;
}

.brand-title{
    font-size:28px;
    font-weight:bold;
}

.brand-subtitle{
    margin-top:4px;
    font-size:12px;
    color:#777;
    line-height:1.4;
}

/* כפתורים */

.bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:-20px;
}

.bottom-he{
    flex:1;
    text-align:right;
}

.bottom-center{
    flex:1;
}

.bottom-en{
    flex:1;
    text-align:left;
}

.btn{
    display:inline-block;
    background:#556b2f;
    color:white;
    text-decoration:none;
    padding:14px 28px;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
}

.btn:hover{
    opacity:.9;
}

/* ========================= */
/* מובייל */
/* ========================= */

@media (max-width:768px){

    .hero-image{
        max-width:100%;
    }

    .bio-row{
        flex-direction:column;
        align-items:center;
        gap:4px;
        margin-top:-15px;
    }

    .bio-he,
    .bio-en,
    .brand{
        width:100%;
        text-align:center;
    }

    .bio-he{
        order:1;
    }

    .brand{
        order:2;
        padding-top:8px;
    }

    .bio-en{
        order:3;
    }

    .bio-he h1{
        font-size:30px;
    }

    .bio-en h2{
        font-size:30px;
    }

    .bio-he p,
    .bio-en p{
        font-size:18px;
    }

    .brand-title{
        font-size:26px;
    }

    .brand-subtitle{
        font-size:13px;
    }

    .bottom-row{
        flex-direction:column;
        gap:8px;
        align-items:center;
        margin-top:0;
    }

    .bottom-he{
        order:1;
    }

    .bottom-en{
        order:2;
    }

    .bottom-he,
    .bottom-en,
    .bottom-center{
        width:100%;
        text-align:center;
    }

    .btn{
        width:100%;
        box-sizing:border-box;
        text-align:center;
    }

}

</style>

</head>

<body>

<div class="container">


<img
src="images/oren-no-text4.jpg"
alt="Oren Shmuel - Israeli Folk Dance Choreographer and Creator"
class="hero-image">

<div class="bio-row">

    <div class="bio-he">

        <h1>אורן שמואל</h1>

        <p>
        כוריאוגרף ויוצר במחול הישראלי<br>
        ובריקודי עם ישראליים
        </p>

    </div>

    <div class="brand">

        <div class="brand-title">
            OrenDance
        </div>

        <div class="brand-subtitle">
            Official Website<br>
            האתר הרשמי
        </div>

    </div>

    <div class="bio-en">

        <h2>Oren Shmuel</h2>

        <p>
        Israeli Folk Dance<br>
        Choreographer and Creator
        </p>

    </div>

</div>

<div class="bottom-row">

    <div class="bottom-he">
        <a class="btn" href="resume-he.html">
            פרופיל בעברית
        </a>
    </div>

    <div class="bottom-center"></div>

    <div class="bottom-en">
        <a class="btn" href="resume-en.html">
            English Profile
        </a>
    </div>

</div>


</div>

</body>
</html>
